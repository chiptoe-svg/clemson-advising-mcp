    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

# LLM providers the email classifier may send mailbox content (subject + body)
# to. This is the IT-reviewable record of where mailbox data may go. The
# classifier refuses any provider not listed here with authorized: true
# (fail closed). Add as many providers as needed.
#   scope: external -> content leaves the M365 envelope; `basis` must cite the
#                      DPA / institutional agreement that covers it, and
#                      `authorized` attests (does not prove) that it applies.
#   scope: local    -> on-host inference (a local LLM); content does not leave
#                      the machine, so no data agreement is required.
data_egress:
  classifiers:
    - provider: codex_chatgpt_edu
      scope: external
      sends: [subject, body]
      basis: "ChatGPT Edu institutional agreement (Clemson)"
      authorized: true

    # DIRECT to OpenAI — RETIRED. This record existed for src/openai-classifier.ts,
    # which dialled api.openai.com with its own key; that module left with the
    # mailcal split (2026-08-24) and no code path in this repo dials OpenAI
    # directly any more (the 2026-08-26 review confirmed: only Clemson hosts
    # appear in src/). Declared unauthorized so the record fails closed if such
    # a path is ever reintroduced: the ONLY sanctioned OpenAI route is the
    # Clemson gateway record below. (agent_backends is a separate section and
    # still lists openai_api for consumer attestation of PUBLIC data.)
    - provider: openai_api
      scope: external
      sends: [subject, body]
      basis: "no direct-to-OpenAI code path exists; route retired 2026-08-24, record closed 2026-08-26"
      authorized: false

    # The advisor's paid fallback, as it is ACTUALLY routed since Clemson IT
    # consolidated their hosted models and their OpenAI access behind one
    # gateway.
    #
    # Content does NOT go to OpenAI directly. It goes to a Clemson-operated
    # gateway at llm.rcd.clemson.edu, authenticated with a Clemson-issued key,
    # and Clemson forwards it to OpenAI. Both the campus-hosted models
    # (/v1) and the OpenAI passthrough (/openai/v1) are the same host and the
    # same credential; this record covers the passthrough, which is the only one
    # of the two that leaves Clemson at all.
    #
    # This is a privacy IMPROVEMENT over the previous direct-to-OpenAI route and
    # is worth stating plainly rather than glossing: the first hop is now
    # Clemson-operated infrastructure over TLS, Clemson holds the OpenAI
    # relationship and the credential rather than this host holding an OpenAI key
    # of its own, and Clemson is positioned to log, police, or cut the forward.
    # The content still ultimately reaches OpenAI, so the scope stays external
    # and the institutional contract is still the basis — the gateway changes WHO
    # controls the egress, not whether egress happens.
    - provider: clemson_llm_gateway_openai
      scope: external
      sends: [subject, body]
      basis: "Clemson-operated LLM gateway (llm.rcd.clemson.edu/openai/v1) over TLS, which forwards to OpenAI under the Clemson institutional contract; Clemson holds the credential and the OpenAI relationship"
      authorized: true

    # Local LLM backends — on-host inference, no egress. Declared and authorized
    # for when a local classifier backend is wired (e.g. OMLX, Ollama).
    - provider: local_omlx
      scope: local
      sends: [subject, body]
      basis: "on-host inference (OMLX); content does not leave the machine"
      authorized: true

    - provider: local_ollama
      scope: local
      sends: [subject, body]
      basis: "on-host inference (Ollama); content does not leave the machine"
      authorized: true

    # NOT on-host. vLLM runs on the DGX Spark box (gcspark.clemson.edu:8080) and
    # is reached over the campus network, in the clear — content leaves this
    # machine, so it is declared external and named for the host it actually
    # talks to. Basis is the hardware being Clemson-owned and Clemson-managed,
    # not an absence of egress.
    - provider: clemson_spark_vllm
      scope: external
      sends: [subject, body]
      basis: "vLLM on Clemson-owned DGX Spark (gcspark.clemson.edu); on-premises Clemson-managed hardware, reached over the campus network via plaintext HTTP"
      authorized: true

    # Clemson RCD LLM cluster — CAMPUS-HOSTED models at llm.rcd.clemson.edu/v1
    # (the "/v1" path, NOT the "/openai/v1" passthrough). Clemson-operated,
    # open-weight models on Clemson infrastructure; content stays inside Clemson
    # and reaches no third party, so this route is FERPA-cleared for identifiable
    # student data. Same host and credential as clemson_llm_gateway_openai, but a
    # DIFFERENT service on a different path — kept as a separate record precisely
    # because their FERPA status differs.
    - provider: clemson_rcd_vllm
      scope: external
      sends: [subject, body]
      basis: "Clemson-operated RCD LLM cluster, campus-hosted models at llm.rcd.clemson.edu/v1 over TLS with a Clemson-issued key; content stays within Clemson infrastructure and is not forwarded to any third party"
      authorized: true

  # Model backends that a CONSUMING AGENT (a paired MCP client) may attest to.
  # An agent's per-agent token is minted only if its --provider is listed here
  # with authorized: true, and the server re-checks this on every request. This
  # is the IT-reviewable record of which AI providers Clemson data may reach via
  # an agent's own reasoning model (distinct from the classifier list above).
  agent_backends:
    # Clemson-hosted inference: the DGX Spark box (gcspark.clemson.edu) and the
    # RCD campus LLM service. This is the advisor's own model chain
    # (ADVISOR_PROVIDER_CHAIN defaults to "spark,rcd") and the most
    # privacy-preserving backend in this table — content stays on Clemson-owned,
    # Clemson-managed hardware and reaches no third party.
    #
    # Added 2026-08-28 (owner approved). It was missing entirely, so the advisor
    # had no way to describe itself and fell back to the "openai_api" default in
    # src/config-mcp.ts — a record of a route it does not use. Its absence is
    # what made every attestation on these servers false; adding it is what lets
    # each caller attest honestly once tokens are issued per consumer.
    #
    # No `data_classes`, i.e. unrestricted: these are exactly the destinations
    # docs/policy/student-data.md already authorizes for IDENTIFIABLE student
    # data, so nothing here needs narrowing.
    #
    # `scope: local` needs its qualifier read. The two values this schema offers
    # are local and external; the existing `local` entry below means "does not
    # leave the machine". Spark and RCD leave this host but do NOT leave
    # Clemson — a third category the schema has no word for. `local` is the
    # closer of the two and the basis states the distinction rather than
    # letting a reviewer infer it.
    - provider: clemson_hosted
      scope: local
      basis: "Clemson-owned, Clemson-managed inference (DGX Spark, RCD campus LLM); leaves this host, does not leave Clemson"
      authorized: true
    - provider: chatgpt_edu
      scope: external
      basis: "ChatGPT Edu institutional agreement (Clemson)"
      authorized: true
    - provider: openai_api
      scope: external
      basis: "OpenAI — covered under Clemson institutional contract"
      authorized: true
    # Owner decision 2026-08-26. Anthropic-backed agents (Claude Code) are
    # authorized ONLY against public-data surfaces: the class-schedule server
    # (8766) and the GC catalog server (8767), which serve published Clemson
    # course, section, and curriculum data and hold no student information
    # (docs/policy/student-data.md). `data_classes` is what enforces that — a
    # caller that does not declare its data class is refused, and a surface
    # declaring "student" is refused, so this entry cannot widen by accident
    # if a credentialed server ever returns to this repo.
    #
    # It does NOT authorize Anthropic for student data, which remains barred
    # everywhere by the same policy document. Before 2026-08-26 this record
    # read `authorized: false` while MCP_PUBLIC/CATALOG_AUTH_TOKEN_PROVIDER
    # defaulted to "openai_api" (src/config.ts) — so Claude Code was already
    # reaching both servers under an OpenAI attestation. This entry replaces
    # that silent misattestation with an accurate, scoped one.
    - provider: anthropic
      scope: external
      basis: "public Clemson catalog/schedule data only; no student data (owner decision 2026-08-26)"
      authorized: true
      data_classes: [public]
    # `local` is the agent --provider value for on-host inference; distinct
    # namespace from the classifier list's local_omlx / local_ollama above.
    - provider: local
      scope: local
      basis: "on-host inference; content does not leave the machine"
      authorized: true

audit_requirements:
  before_action:
    - timestamp
    - action_id
    - target_identifier
    - normalized_payload
    - policy_decision
  after_action:
    - timestamp
    - action_id
    - target_identifier
    - result_identifier
    - provider_response_status

enforcement_requirements:
  - host_enforced_allow_list
  - no_direct_model_graph_access
  - runtime_policy_check_per_action
  - append_only_decision_logging
  - append_only_usage_logging
