# Authorized-use list for the two public-data MCP servers this repo runs: the
# class-schedule server (8766) and the curriculum catalog server (8767).
# Every action is a read of published Clemson data. `approval: none` is what
# exposes an action; anything else fails closed at the policy boundary.

policy_version: 1
policy_name: clemson_public_data_servers

actions:
  - id: host.list_skills
    surface: host_state
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - local_state_only

  - id: host.get_skill_docs
    surface: host_state
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - local_state_only

  # Public, no-auth third-party reads (Clemson Banner Browse Classes). Not
  # Microsoft Graph — no delegated token or consent involved. Read-only.
  - id: clemson.list_terms
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.search_classes
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.find_alternatives
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.check_conflicts
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.course_details
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.gc_catalog_years
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  # Searches the semester plan AND the requirement rules for one course or
  # subject code. Same public catalog data as the two tools it spans; exists
  # because a not-found from either one alone is not evidence of absence
  # (2026-08-27 PCID miss).
  - id: clemson.gc_find_course_in_program
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  # The program list and a single course's catalog entry. Added 2026-08-28 so
  # the advisor's Program selector and course hover card can read them over MCP
  # instead of opening gc_advisor.db on a shared filesystem — the coupling that
  # stops working the moment these servers move to their own machine.
  - id: clemson.gc_list_programs
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.gc_get_course
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.gc_program_plan
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.gc_requirement_rules
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.gc_gen_ed
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  # Deterministic degree audit on a sanitized gc-progress-v1 record.
  # Input is sanitized-by-construction: course codes + terms + credits only;
  # no grades, no student identity, no FERPA content. Runs on-host (execFile
  # to audit.py in gc_advisor), no external network call. Treated as external_read
  # because it consumes catalog data via the gc_advisor DB.
  - id: clemson.gc_audit_progress
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  # Authoritative section rows by CRN, read from the local Banner snapshot.
  # Backs the advisor's host-side confirmation that a model-proposed CRN is
  # real before a schedule is rendered into a printable document.
  # CRNs resolved from course + section, for pastes that carry no CRN.
  # Ambiguity resolves to null, never a guess.
  - id: clemson.resolve_crns
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.sections_by_crn
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.find_conflict_free_schedule
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.find_requirement_sections
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.gc_program_requirements
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

  - id: clemson.schedule_freshness
    surface: external_read
    risk: low
    reversibility: read_only
    approval: none
    constraints:
      - public_data_only

data_egress:
  # Model backends that a CONSUMING AGENT (a paired MCP client) may attest to.
  # An agent's per-agent token is minted only if its --provider is listed here
  # with authorized: true, and the server re-checks this on every request. This
  # is the IT-reviewable record of which AI providers Clemson data may reach via
  # an agent's own reasoning model.
  agent_backends:
    # Clemson-hosted inference: the DGX Spark box (gcspark.clemson.edu) and the
    # RCD campus LLM service. This is the advisor's own model chain
    # (ADVISOR_PROVIDER_CHAIN defaults to "spark,rcd") and the most
    # privacy-preserving backend in this table — content stays on Clemson-owned,
    # Clemson-managed hardware and reaches no third party.
    #
    # Added 2026-08-28 (owner approved). It was missing entirely, so the advisor
    # had no way to describe itself and fell back to the "openai_api" default in
    # src/config-mcp.ts — a record of a route it does not use. Its absence is
    # what made every attestation on these servers false; adding it is what lets
    # each caller attest honestly once tokens are issued per consumer.
    #
    # No `data_classes`, i.e. unrestricted: these are exactly the destinations
    # docs/policy/student-data.md already authorizes for IDENTIFIABLE student
    # data, so nothing here needs narrowing.
    #
    # `scope: local` needs its qualifier read. The two values this schema offers
    # are local and external; the existing `local` entry below means "does not
    # leave the machine". Spark and RCD leave this host but do NOT leave
    # Clemson — a third category the schema has no word for. `local` is the
    # closer of the two and the basis states the distinction rather than
    # letting a reviewer infer it.
    - provider: clemson_hosted
      scope: local
      basis: "Clemson-owned, Clemson-managed inference (DGX Spark, RCD campus LLM); leaves this host, does not leave Clemson"
      authorized: true
    - provider: chatgpt_edu
      scope: external
      basis: "ChatGPT Edu institutional agreement (Clemson)"
      authorized: true
    - provider: openai_api
      scope: external
      basis: "OpenAI — covered under Clemson institutional contract"
      authorized: true
    # Owner decision 2026-08-26. Anthropic-backed agents (Claude Code) are
    # authorized ONLY against public-data surfaces: the class-schedule server
    # (8766) and the GC catalog server (8767), which serve published Clemson
    # course, section, and curriculum data and hold no student information
    # (docs/policy/student-data.md). `data_classes` is what enforces that — a
    # caller that does not declare its data class is refused, and a surface
    # declaring "student" is refused, so this entry cannot widen by accident
    # if a credentialed server ever returns to this repo.
    #
    # It does NOT authorize Anthropic for student data, which remains barred
    # everywhere by the same policy document. Before 2026-08-26 this record
    # read `authorized: false` while MCP_PUBLIC/CATALOG_AUTH_TOKEN_PROVIDER
    # defaulted to "openai_api" (src/config.ts) — so Claude Code was already
    # reaching both servers under an OpenAI attestation. This entry replaces
    # that silent misattestation with an accurate, scoped one.
    - provider: anthropic
      scope: external
      basis: "public Clemson catalog/schedule data only; no student data (owner decision 2026-08-26)"
      authorized: true
      data_classes: [public]
    # `local` is the agent --provider value for on-host inference.
    - provider: local
      scope: local
      basis: "on-host inference; content does not leave the machine"
      authorized: true
