slot_type = "Support Area Requirement"
# Registrar (all four years, docs/degreeworks/freshman_management_*.md):
# "(Option 1) Declare and complete a minor requiring AT LEAST 15 hours ...
#  or (Option 2) Complete 15 hours ... from the approved list" where the
# approved list is `@ 3000:4999` (ANY subject at 3000+) plus nine modern
# languages at 2000+. The broadest support area in the college — and fully
# expressible, unlike Marketing's (level split) or Economics' (single
# prefix).
